name: Build and Deploy FOX OS Chromebook Companion

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foxos-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct icon folder
        shell: bash
        run: |
          set -e
          mkdir -p icons
          for size in 48 72 96 128 144 192 256 384 512; do
            if [ -f "icon-${size}.png" ]; then cp "icon-${size}.png" "icons/icon-${size}.png"; fi
          done
          if [ -f "fox-os-logo.png" ]; then
            for size in 48 72 96 128 144 192 256 384 512; do
              if [ ! -f "icons/icon-${size}.png" ]; then cp "fox-os-logo.png" "icons/icon-${size}.png"; fi
            done
          fi

      - name: Validate site
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.json
          test -f service-worker.js
          test -f fox-os-logo.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png

      - name: Package PWA
        run: |
          set -e
          rm -rf dist
          mkdir -p dist/icons
          cp index.html styles.css app.js manifest.json service-worker.js fox-os-logo.png dist/
          cp README.txt INSTALL.txt dist/ 2>/dev/null || true
          cp icons/*.png dist/icons/
          cd dist
          zip -r ../FOXOS-Chromebook-PWA.zip .

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOXOS-Chromebook-PWA
          path: FOXOS-Chromebook-PWA.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy FOX OS Chromebook PWA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA files
        run: |
          set -e
          test -f index.html
          test -f manifest.json
          test -f service-worker.js
          test -f fox-os-logo.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png

      - name: Package PWA
        run: |
          set -e
          mkdir -p dist
          cp index.html styles.css app.js manifest.json service-worker.js fox-os-logo.png README.txt INSTALL.txt dist/
          cp -r icons dist/icons
          cd dist
          zip -r ../FOXOS-Chromebook-PWA.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOXOS-Chromebook-PWA
          path: FOXOS-Chromebook-PWA.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

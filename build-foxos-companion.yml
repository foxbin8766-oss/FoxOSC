name: Build FOX OS Chromebook PWA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package PWA
        run: |
          mkdir -p dist
          cp index.html styles.css app.js manifest.json service-worker.js README.txt INSTALL.txt dist/
          cp -r icons dist/icons
          cd dist
          zip -r ../FOXOS-Chromebook-PWA.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FOXOS-Chromebook-PWA
          path: FOXOS-Chromebook-PWA.zip
  deploy:
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
